<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Park Lens promo tile</title>
    <style>
      /* 440×280 Chrome Web Store small promo tile, rendered by scripts/store-assets.mjs. */
      html,
      body {
        width: 440px;
        height: 280px;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 28px;
        box-sizing: border-box;
        background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
        color: #ffffff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 38px;
        font-weight: 700;
      }
      .brand img {
        border-radius: 12px;
        background: #ffffff;
      }
      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
        color: #ccfbf1;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="/src/assets/icons/icon-128.png" alt="" width="52" height="52" />
      <span>Park Lens</span>
    </div>
    <p>City parking near your Google Maps destination<br />Kitchener &amp; Waterloo, ON</p>
  </body>
</html>
